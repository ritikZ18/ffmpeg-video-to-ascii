<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Software Engineer Happy Dance</title>


    <!-- App CSS -->
    <link
        rel="stylesheet"
        href="/style.css"
    >


    <!-- XTERM -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css"
    >


    <!-- XTERM CORE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js">
    </script>


    <!-- XTERM FIT -->
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js">
    </script>


    <!-- XTERM WEBGL -->
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js">
    </script>

</head>


<body>

    <!-- CRT overlay -->
    <div class="crt"></div>


    <main id="terminal">


        <!-- =====================================
             BOOT
        ====================================== -->

        <section id="boot-screen">

            <div id="boot-log"></div>


            <div
                id="ready-panel"
                class="hidden"
            >

                <p class="ready">
                    ARE YOU READY?
                </p>


                <button
                    id="enter-button"
                    type="button"
                >
                    [ ENTER SYSTEM ]
                </button>


                <p class="hint">
                    PRESS ENTER
                </p>

            </div>

        </section>


        <!-- =====================================
             MODE SELECT
        ====================================== -->

        <section
            id="mode-screen"
            class="hidden"
        >

            <p class="dim">
                RUST//FRAME PLAYBACK PROTOCOL
            </p>


            <p>
                &gt; SELECT EXPERIENCE
            </p>


            <div class="options">


                <!-- VISUAL ONLY -->

                <div
                    data-mode="visual"
                >

                    <span class="selector">
                        &nbsp;
                    </span>

                    [1] VISUAL ONLY

                    <span class="dim">
                        // AUDIO MUTED
                    </span>

                </div>


                <!-- FULL -->

                <div
                    data-mode="full"
                    class="selected"
                >

                    <span class="selector">
                        &gt;
                    </span>

                    [2] FULL EXPERIENCE

                    <span class="dim">
                        // DEFAULT
                    </span>

                </div>

            </div>


            <p class="hint">
                [1/2] SELECT
                &nbsp;&nbsp;
                [ENTER] EXECUTE
            </p>

        </section>


        <!-- =====================================
             PLAYER
        ====================================== -->

        <section
            id="player-screen"
            class="hidden"
        >


            <!-- HEADER -->

            <header>

                <span>
                    RUST//FRAME
                </span>


                <span id="status">
                    INITIALIZING
                </span>

            </header>


            <!-- MAIN TERMINAL -->

            <div id="render-area">

                <div id="xterm"></div>

            </div>


            <!-- FOOTER -->

            <footer>

 <span
        id="exit-control"
        role="button"
        tabindex="0"
    >
        [Q] EXIT
    </span>


                <span
                    id="audio-control"
                    role="button"
                    tabindex="0"
                >
                    [M] AUDIO: ON
                </span>


            </footer>


        </section>

    </main>


    <!--
        AUDIO ONLY.

        Browser plays the audio track from input.mp4.
        Video itself is never visually displayed.
    -->

    <audio
    id="audio"
    src="/assets/audio.m4a"
    preload="auto">
</audio>


    <!-- Application -->
    <script src="/app.js"></script>

</body>

</html>
